<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">  
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>  
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">  
    <style>
        body, html {
            margin: 0; padding: 0;
            background-color: #FFE6EC; /* light pink background */
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-end; /* Phone at the bottom */
            overflow: hidden;
            width: 100%;
            height: 100%;
        }
        
        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .text-section {
            text-align: center;
            width: 90%;
            padding-top: 14%; /* Space at top */
            flex: 0 0 auto;
            z-index: 10;
        }

        .title {
            font-family: 'Playfair Display', serif;
            color: #1C1C1C;
            font-size: 7vw;
            font-weight: 700;
            line-height: 1.15;
            margin: 0;
            margin-top: 1.5%;
            letter-spacing: -0.01em;
        }

        .subtitle {
            font-family: 'Inter', sans-serif;
            color: #E25C70; /* vibrant branding pink-red */
            font-size: 3.2vw;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin: 0;
        }

        .phone-wrapper {
            position: absolute;
            bottom: -5%; /* Let it bleed off the bottom slightly */
            width: 82%; /* Adjust width of phone relative to screen */
            border-radius: 46px;
            box-shadow: 
                0 0 0 2px #EBE3D5, /* Polished outer edge highlight */
                0 35px 70px rgba(226, 92, 112, 0.25);
            overflow: hidden;
            border: 13px solid #B0A597; /* Premium Natural Titanium Bezel */
            background: #1C1C1C;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        
        .phone-wrapper img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="text-section">
            <h2 class="subtitle" id="subtitleText">SCANNING CAMERA</h2>
            <h1 class="title" id="titleText">Scan Makeup Barcodes<br>Instantly</h1>
        </div>
        <div class="phone-wrapper" id="phoneWrapper">
            <img id="mockupImg" src="" />
        </div>
    </div>
    
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const index = urlParams.get('i') || '0';
        
        const data = [
            { img: 'mockup-scanner.jpg', sub: 'SCANNING CAMERA', title: 'Scan Makeup Barcodes<br>Instantly' },
            { img: 'mockup-analysis-1.jpg', sub: 'PRODUCT RATING', title: 'Expose Clogging &<br>Toxic Ingredients' },
            { img: 'mockup-analysis-3.jpg', sub: 'AI FACE SCAN', title: 'Match Your Perfect<br>Shade & Fit' },
            { img: 'mockup-analysis-2.jpg', sub: 'SIDE-BY-SIDE COMPARISON', title: 'Swap Bad Products<br>for Clean Matches' }
        ];
        
        const item = data[parseInt(index)] || data[0];
        document.getElementById('subtitleText').innerHTML = item.sub;
        document.getElementById('titleText').innerHTML = item.title;
        document.getElementById('mockupImg').src = item.img;

        // Dynamic adjusting for 5.5 inch (wider aspect ratio 1242x2208 vs 1284x2778)
        const width = window.innerWidth;
        const height = window.innerHeight;
        const ratio = height / width;
        
        if (ratio < 2.0) { // 5.5 inch is ~1.77
            document.querySelector('.text-section').style.paddingTop = '10%';
            document.querySelector('.phone-wrapper').style.width = '66%';
            document.querySelector('.phone-wrapper').style.bottom = '-8%';
            document.querySelector('.title').style.fontSize = '6.2vw';
            document.querySelector('.subtitle').style.fontSize = '2.8vw';
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">  
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>  
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">  
    <style>
        body, html {
            margin: 0; padding: 0;
            background-color: #FFF9F7; /* rhode-white */
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-end; /* Phone at the bottom */
            overflow: hidden;
        }
        
        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .text-section {
            text-align: center;
            width: 90%;
            padding-top: 12%; /* Space at top */
            flex: 0 0 auto;
        }

        .title {
            font-family: 'Playfair Display', serif;
            color: #3D3532;
            font-size: 6.5vw;
            font-weight: 700;
            line-height: 1.1;
            margin: 0;
            margin-bottom: 2%;
        }

        .subtitle {
            font-family: 'Inter', sans-serif;
            color: #D98A96; /* rhode-pink-rich */
            font-size: 3.2vw;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin: 0;
        }

        .phone-wrapper {
            position: absolute;
            bottom: -5%; /* Let it bleed off the bottom slightly */
            width: 80%; /* Adjust width of phone relative to screen */
            border-radius: 40px;
            box-shadow: 0 30px 60px rgba(61, 53, 50, 0.2);
            overflow: hidden;
            border: 12px solid #3D3532;
            background: black;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        
        .phone-wrapper img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="text-section">
            <h2 class="subtitle" id="subtitleText">Smart Beauty</h2>
            <h1 class="title" id="titleText">Scan Any Product</h1>
        </div>
        <div class="phone-wrapper" id="phoneWrapper">
            <img id="mockupImg" src="" />
        </div>
    </div>
    
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const index = urlParams.get('i') || '0';
        
        const data = [
            { img: 'mockup-scanner.jpg', sub: 'Instant Scanner', title: 'Scan Any Skincare<br>or Makeup' },
            { img: 'mockup-analysis-1.jpg', sub: 'Transparency', title: 'Uncover Toxic<br>Ingredients' },
            { img: 'mockup-analysis-2.jpg', sub: 'Skin Barrier', title: 'Check Acne-Safe<br>Ratings' },
            { img: 'mockup-analysis-3.jpg', sub: 'Personalized', title: 'Find Your Perfect<br>Shade Match' }
        ];
        
        const item = data[parseInt(index)];
        document.getElementById('subtitleText').innerHTML = item.sub;
        document.getElementById('titleText').innerHTML = item.title;
        document.getElementById('mockupImg').src = item.img;

        // Dynamic adjusting for 5.5 inch (which is wider aspect ratio 1242x2208 vs 1284x2778)
        const width = window.innerWidth;
        const height = window.innerHeight;
        const ratio = height / width;
        
        if (ratio < 2.0) { // 5.5 inch is ~1.77, 6.5 inch is ~2.16
            // Wider screen requires slightly smaller phone width and top padding adjustment
            document.querySelector('.text-section').style.paddingTop = '8%';
            document.querySelector('.phone-wrapper').style.width = '65%';
            document.querySelector('.phone-wrapper').style.bottom = '-8%';
            document.querySelector('.title').style.fontSize = '6vw';
            document.querySelector('.subtitle').style.fontSize = '2.8vw';
        }
    </script>
</body>
</html>

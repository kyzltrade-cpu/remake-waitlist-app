<html lang="en">
<head>
  <meta charset="UTF-8" />  
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />  
  <meta name="theme-color" content="#FFF9F7" />  
  <!-- Apple Standalone Mobile Web App (PWA) configuration to eliminate status bar gaps -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="REMAKE" />
  <link rel="canonical" href="https://remake.beauty/success.html" />
  <meta name="description" content="Welcome to the REMAKE Beauty Waitlist. Your spot is locked, and your exclusive discount is secured. Meet your new digital beauty coach soon!">
  <title>Welcome to the REMAKE Beauty Waitlist • REMAKE Beauty</title>
  <link rel="icon" href="./favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">  
  <script src="https://cdn.tailwindcss.com"></script>  
  <link rel="preconnect" href="https://fonts.googleapis.com">  
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>  
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">  
  <style>  
    :root {  
      --rhode-text: #2A2421;  
      --rhode-white: #FFF9F7;  
      --rhode-ivory: #FFF5F2;  
      --rhode-cream: #FDF0EC;  
      --rhode-beige: #FBE8E3;  
      --rhode-blush: #FCE4EC;  
      --rhode-pink: #FDA8BD;  
      --rhode-pink-mid: #F0B8C0;  
      --rhode-pink-deep: #E8A0AA;  
      --rhode-pink-rich: #D98A96;  
      --rhode-gold: #D4AF37;  
      --rhode-gold-soft: #E6C88A;  
      --rhode-gold-dark: #B8943E;  
      --rhode-border: #F5DDE3;  
      --rhode-gray: #7C726E;  
      --rhode-light-gray: #B8ADA9;  
      --rhode-success: #6E8E75;  
      --rhode-error: #C96F6F;  
        
      --radius-soft: 20px;  
      --radius-pill: 100px;  
      --glaze-gradient: linear-gradient(135deg, rgba(255,255,255,0.7) 0%, rgba(253,240,236,0.4) 50%, rgba(253,168,189,0.1) 100%);  
      --card-shadow: 0 10px 30px rgba(42,36,33,0.03), 0 1px 3px rgba(217,138,150,0.05);  
      --hover-shadow: 0 20px 40px rgba(42,36,33,0.06), 0 4px 15px rgba(217,138,150,0.12);  
    }  
    * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; box-sizing: border-box; }  
    html {
      background: var(--rhode-white);
    }
    body {   
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;   
      background: var(--rhode-white); color: var(--rhode-text);  
      line-height: 1.8; font-weight: 400;  
    }  
    .font-serif { font-family: 'Playfair Display', serif; }  
    .font-luxury { font-family: 'Cormorant Garamond', serif; }
    .font-light { font-weight: 300; }  
      
    body::before {  
      content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;  
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.02'/%3E%3C/svg%3E");  
      pointer-events: none; z-index: 100;  
    }

    .btn-primary, .btn-secondary {  
      position: relative; overflow: hidden;  
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);  
      font-family: 'Inter', sans-serif; font-weight: 500;  
      letter-spacing: 0.15em; text-transform: uppercase; font-size: 0.7rem;  
      display: inline-flex; align-items: center; justify-content: center; gap: 0.6rem;  
      cursor: pointer; border-radius: var(--radius-pill);  
    }  
    .btn-primary {   
      background: var(--rhode-text);   
      color: var(--rhode-white);   
      border: 1px solid var(--rhode-text);   
      padding: 0.85rem 1.8rem;  
      box-shadow: 0 4px 15px rgba(42,36,33,0.1);  
    }  
    .btn-primary:hover {   
      background: var(--rhode-pink-rich);   
      border-color: var(--rhode-pink-rich);   
      color: var(--rhode-white);  
      transform: translateY(-2px);   
      box-shadow: 0 8px 25px rgba(217,138,150,0.3);   
    }  
    .btn-secondary { 
      background: transparent; 
      color: var(--rhode-text); 
      border: 1px solid var(--rhode-border); 
      padding: 0.85rem 1.8rem; 
    }  
    .btn-secondary:hover { 
      background: rgba(253,168,189,0.08); 
      border-color: var(--rhode-pink-mid); 
      transform: translateY(-2px); 
    }  
    
    .card-luxury {  
      border: 1px solid rgba(245,221,227,0.7); background: rgba(255,253,252,0.75);  
      backdrop-filter: blur(20px); transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);  
      position: relative; overflow: hidden; border-radius: var(--radius-soft);  
      box-shadow: var(--card-shadow);  
    }  
    .card-luxury::before {  
      content: ""; position: absolute; inset: 0; background: var(--glaze-gradient);  
      opacity: 0; transition: opacity 0.5s ease; pointer-events: none;  
    }  
    .card-luxury:hover { box-shadow: var(--hover-shadow); transform: translateY(-4px); border-color: rgba(245,221,227,0.95); }  
    .card-luxury:hover::before { opacity: 1; }  
      
    .badge-luxury {  
      background: rgba(110,142,117,0.1);   
      color: var(--rhode-success); font-size: 0.65rem; font-weight: 600;  
      padding: 0.45rem 1.1rem; border-radius: var(--radius-pill); letter-spacing: 0.15em; text-transform: uppercase;  
      border: 1px solid rgba(110,142,117,0.15);
      display: inline-block;
    }  
      
    .hero-title { font-family: 'Playfair Display', serif; font-weight: 400; letter-spacing: -0.01em; line-height: 1.2; }  
    .section-title { font-family: 'Playfair Display', serif; font-weight: 400; letter-spacing: -0.005em; color: var(--rhode-text); }  
    .nav-link {  
      font-size: 0.75rem; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; position: relative; color: var(--rhode-gray);  
      transition: color 0.3s ease;
    }  
    .nav-link::after {  
      content: ""; position: absolute; bottom: -5px; left: 0; width: 0; height: 1px;  
      background: var(--rhode-pink-rich); transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);  
    }  
    .nav-link:hover { color: var(--rhode-text); }  
    .nav-link:hover::after { width: 100%; }  
    .text-elegant { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 400; }  
    .text-pink-solid { color: var(--rhode-pink-rich); }  
    
    .logo-wrap {  
      display: inline-flex; align-items: center; gap: 0.85rem;  
      padding: 0.4rem 0.8rem; border-radius: var(--radius-pill);  
      transition: all 0.3s ease;  
    }  
    .logo-wrap:hover { background: rgba(253,168,189,0.08); }  
    .logo-wrap img {  
      height: 34px; width: 34px;  
      object-fit: contain;  
      background: #FFF0F3; /* Soft blush pastel pink background matching the brand palette */  
      border-radius: 8px; /* Elegant rounded square app icon squircle shape */  
      padding: 5px; /* Inner margin to keep the transparent silhouette perfectly framed */  
      border: 1px solid rgba(253,168,189,0.3); /* Subtle, premium border */  
      box-shadow: 0 3px 10px rgba(217,138,150,0.08);  
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease;  
    }  
    .logo-wrap:hover img {   
      transform: scale(1.08);   
      box-shadow: 0 5px 15px rgba(217,138,150,0.18);  
    }  
    .logo-text { font-family: 'Playfair Display', serif; font-size: 1.35rem; font-weight: 500; letter-spacing: 0.1em; color: var(--rhode-text); }
